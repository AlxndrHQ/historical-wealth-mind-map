<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiet Capital — Mind Map &amp; Executive Briefing</title>
<meta name="description" content="Interactive mind map and executive dossiers on quiet millionaires, billionaires, and historic Black business visionaries: origins, capital engines, and asset-protection models.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#090c11; --bg2:#0d1218; --panel:#111821; --panel2:#16202b; --line:#1d2833; --line2:#2a3846;
  --text:#e7edf3; --muted:#8d9aa8; --dim:#5a6776;
  --blue:#3B82F6; --purple:#8B5CF6; --gold:#F59E0B; --green:#10B981; --entity:#64748B; --hub:#E2E8F0;
  --doc:#10B981; --pattern:#f5a524;
  --r:12px; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
::selection{background:#3B82F644}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ============ HEADER ============ */
header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e141c,#0a0e13);padding:12px 20px 0;flex:none;z-index:5}
.row1{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#3B82F633,#8B5CF622 60%,transparent);border:1px solid var(--line2)}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.search{flex:1;min-width:200px;max-width:520px;position:relative;margin-left:auto}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 12px 9px 34px;color:var(--text);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3B82F622}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 10.5px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.row2{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.row2::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:all .15s}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--c,#8d9aa8);box-shadow:0 0 8px var(--c,transparent)}
.chip .n{font:500 10.5px var(--mono);color:var(--dim)}
.chip:hover{color:var(--text);border-color:#3a4a5c}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--c,var(--text));background:color-mix(in srgb,var(--c,#8d9aa8) 12%,transparent)}
.divider{width:1px;height:22px;background:var(--line2);flex:none}
.lbl{font:500 10.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.8px;flex:none}

/* ============ STAGE ============ */
main{flex:1;min-height:0;position:relative}
#map,#grid{position:absolute;inset:0}
#map{background:radial-gradient(1200px 600px at 50% 40%,#0f1620 0%,var(--bg) 70%)}
#map svg{display:block;width:100%;height:100%;cursor:grab}
#map svg:active{cursor:grabbing}
#grid{overflow:auto;padding:22px 20px 40px}
[hidden]{display:none!important}

/* graph */
.link{fill:none;stroke-width:1.4;opacity:.55;transition:opacity .15s}
.link.dashed{stroke-dasharray:6 4}
.link.dotted{stroke-dasharray:1.5 4;stroke-linecap:round}
.elabel{font:500 9.5px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;opacity:0;pointer-events:none;transition:opacity .2s}
svg.zoomed .elabel{opacity:.85}
.node{cursor:pointer}
.node text{font-family:var(--sans);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.profile text{font-size:12px;font-weight:700;fill:var(--text)}
.node.entity text{font-size:10.5px;font-weight:500;fill:var(--muted)}
.node .halo{opacity:.0;transition:opacity .2s}
.node:hover .halo,.node.sel .halo{opacity:.55}
.node,.link,.elabel{transition:opacity .18s}
.faded{opacity:.08!important}
.dimq{opacity:.16!important}
.link.hot{opacity:1;stroke-width:2.2}
.node .minor{opacity:0;transition:opacity .2s}
svg.zoomed .node .minor,.node:hover .minor,.node.nb .minor,.node.sel .minor{opacity:1}
.node.hub text{fill:var(--hub);font-weight:700}

/* overlays */
.overlay{position:absolute;background:#0d1319e6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;font-size:12px}
.legend{left:16px;bottom:16px;max-width:260px}
.legend h4,.ctrls h4{margin:0 0 6px;font:600 10px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.legend .it{display:flex;align-items:center;gap:8px;color:var(--muted);line-height:1.9}
.legend .sw{width:10px;height:10px;border-radius:50%;flex:none}
.legend .ln{width:22px;height:0;border-top:2px solid;flex:none}
.legend .extra{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.legend .extra h4+.sizes{margin-bottom:8px}
.legend .sizes{display:flex;gap:10px;align-items:flex-end;color:var(--muted);font-size:11px}
.legend .sz{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.legend .sz i{display:block;border:1.2px solid #94A3B8;border-radius:50%}
.seg .n{font:500 10px var(--mono);color:var(--dim);margin-left:3px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid}
.b-origin{color:#FCD34D;border-color:#F59E0B55;background:#F59E0B14}
.b-engine{color:#93C5FD;border-color:#3B82F655;background:#3B82F614}
.b-capital{color:#C4B5FD;border-color:#8B5CF655;background:#8B5CF614}
.dbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.dbadge{border:1px solid;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;line-height:1.3}
.dbadge label{display:block;font:600 9px var(--mono);letter-spacing:.8px;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.sec blockquote.callout{margin-bottom:10px}
.ctrls{right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.ctrls .btns{display:flex;gap:6px}
.ibtn{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);font-weight:600}
.ibtn:hover{color:var(--text);border-color:#3a4a5c}
.ibtn.ovl[aria-pressed="true"]{color:var(--text);border-color:var(--hub);background:#E2E8F01a}
.hint{left:50%;top:14px;transform:translateX(-50%);color:var(--muted);font-size:11.5px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;pointer-events:none}

/* ============ GRID ============ */
.gridhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:1280px;margin:0 auto 14px;flex-wrap:wrap}
.gridhead h2{margin:0;font-size:18px}
.gridhead .meta{font:500 11.5px var(--mono);color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;max-width:1280px;margin:0 auto}
.card{position:relative;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;outline:none;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 10px 30px -12px color-mix(in srgb,var(--c) 40%,transparent)}
.ctop{display:flex;align-items:center;gap:8px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.ctop .d{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.ctop .era{margin-left:auto;color:var(--dim)}
.card h3{margin:10px 0 2px;font-size:17px;letter-spacing:.1px}
.life{font-size:12px;color:var(--dim)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.kpi label,.bt label{display:block;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:2px}
.kpi b{font-size:12.5px;font-weight:600;display:block;line-height:1.35}
.kpi b.mono{font-family:var(--mono);color:var(--c)}
.bt{margin:0;font-size:13px;color:#c9d3dd}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:1px 7px}
mark{background:#F59E0B33;color:inherit;border-radius:3px;padding:0 1px}
.foot{max-width:1280px;margin:22px auto 0;font-size:11.5px;color:var(--dim)}

/* ============ OVERLAPS ============ */
.lede{max-width:1280px;margin:0 auto 18px;color:var(--muted);font-size:13px}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1280px;margin:0 auto}
.hub{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.hub .hh{display:flex;align-items:flex-start;gap:10px}
.hub .hh button{background:none;border:0;padding:0;text-align:left;font-size:15px;font-weight:700;color:var(--text)}
.hub .hh button:hover{text-decoration:underline}
.hub .kind{display:block;font:500 10.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-top:2px}
.hub .cnt{margin-left:auto;flex:none;font:600 11px var(--mono);color:var(--hub);border:1px solid #E2E8F055;background:#E2E8F010;border-radius:999px;padding:2px 9px}
.who{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.who button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
.who button:hover{border-color:#3a4a5c}
.who .d{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.who .nm{font-weight:600;font-size:13px;flex:none}
.who .via{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.subh{max-width:1280px;margin:30px auto 12px;font-size:15px}
.ties{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.tie{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.tie button{background:none;border:0;padding:0;font-weight:600;color:var(--text)}
.tie button:hover{text-decoration:underline}
.tie .rel{color:var(--muted);font-size:12px}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
aside#drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(580px,100vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:21;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px #000}
aside#drawer.open{transform:none}
.dhead{padding:18px 22px 16px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,transparent),transparent)}
.dhead::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);box-shadow:0 0 16px var(--c)}
.dclose{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.dclose:hover{color:var(--text)}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--c);display:flex;gap:10px;align-items:center}
.eyebrow span+span{color:var(--dim)}
.dhead h2{margin:8px 44px 2px 0;font-size:24px;line-height:1.2;letter-spacing:-.2px}
.dbody{flex:1;overflow:auto;padding:18px 22px 40px}
.dbody .kpis{grid-template-columns:repeat(3,1fr);margin-top:0}
.note{font-size:11.5px;color:var(--muted);margin:-4px 0 14px;padding:8px 10px;border-left:2px solid var(--pattern);background:#f5a52410;border-radius:0 8px 8px 0}
blockquote.callout{margin:0 0 18px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--c) 7%,transparent);font-size:14px}
blockquote.callout label{display:block;font:600 9.5px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.sec{margin-top:22px}
.sec h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.2px}
.sec h3 .num{font:600 10.5px var(--mono);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:6px;padding:1px 6px}
.sec p{margin:0;color:#c9d3dd}
ol.steps,ul.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li,ul.bul li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#c9d3dd;font-size:13.5px}
ol.steps li b,ul.bul li b{color:var(--text)}
.basis{float:right;margin:1px 0 4px 8px;font:600 9px var(--mono);letter-spacing:.7px;padding:2px 6px;border-radius:5px;text-transform:uppercase;cursor:help}
.basis.documented{color:var(--doc);border:1px solid #10B98155;background:#10B98112}
.basis.pattern{color:var(--pattern);border:1px solid #f5a52455;background:#f5a52412}
.net{display:flex;flex-direction:column;gap:6px}
.net button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .15s}
.net button:hover{border-color:#3a4a5c}
.net .d{width:9px;height:9px;border-radius:50%;flex:none}
.net .nm{font-weight:600;font-size:13px}
.net .rel{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.net .ar{font-family:var(--mono);color:var(--dim);font-size:11px}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.disc{margin-top:24px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px}

/* ============ RESPONSIVE ============ */
@media (max-width:760px){
  header.top{padding:10px 14px 0}
  .row2{flex-wrap:nowrap}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .search kbd{display:none}
  .row1 .seg{margin-left:auto}
  .brand small{display:none}
  #grid{padding:16px 14px 40px}
  .legend .extra{display:none}
  .dbadges{grid-template-columns:1fr}
  .legend{left:10px;top:10px;bottom:auto;padding:6px 10px;font-size:11px}
  .legend h4{display:none}
  .legend .it{line-height:1.7}
  .ctrls{right:10px;left:10px;bottom:10px;flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:8px}
  .ctrls .seg button{padding:5px 9px;font-size:12px}
  .ctrls h4{display:none}
  .hint{display:none}
  .dhead,.dbody{padding-left:16px;padding-right:16px}
  .dbody .kpis{grid-template-columns:1fr 1fr}
  .dhead h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="4" cy="4" r="2.2" fill="#3B82F6"/><circle cx="12" cy="5" r="2.2" fill="#8B5CF6"/><circle cx="5" cy="12" r="2.2" fill="#F59E0B"/><circle cx="12.5" cy="12" r="2.2" fill="#10B981"/><path d="M4 4L12 5M4 4L5 12M12 5L12.5 12M5 12L12.5 12" stroke="#5a6776" stroke-width=".8"/></svg>
        </div>
        <div><h1>Quiet Capital</h1><small>Mind Map · Executive Briefing</small></div>
      </div>
      <label class="search" aria-label="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search names, strategies, industries…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="seg" role="group" aria-label="View">
        <button data-view="map" aria-pressed="true">Mind Map Graph</button>
        <button data-view="grid" aria-pressed="false">Directory Cards</button>
        <button data-view="overlaps" aria-pressed="false">Overlaps</button>
      </div>
    </div>
    <div class="row2">
      <span class="lbl">Archetype</span>
      <div class="chips" id="catChips"></div>
      <span class="divider"></span>
      <span class="lbl">Net Worth</span>
      <div class="seg" id="tierSeg" role="group" aria-label="Net worth tier"></div>
    </div>
  </header>

  <main>
    <section id="map" aria-label="Mind map">
      <div class="overlay hint">Drag nodes · Scroll to zoom · Click for dossier</div>
      <div class="overlay legend" id="legend"></div>
      <div class="overlay ctrls">
        <h4>Layout</h4>
        <div class="seg" id="layoutSeg" role="group" aria-label="Layout">
          <button data-layout="force" aria-pressed="true">Organic</button>
          <button data-layout="cluster" aria-pressed="false">Clusters</button>
          <button data-layout="tier" aria-pressed="false">By Tier</button>
        </div>
        <div class="btns">
          <button class="ibtn" id="fitBtn">Fit view</button>
          <button class="ibtn" id="shakeBtn">Re‑run layout</button>
        </div>
        <button class="ibtn ovl" id="ovlBtn" aria-pressed="false" title="Show only people who share a company or deal with someone else, and the paths that connect them">Overlaps only</button>
      </div>
      <div class="empty" id="mapEmpty" hidden>No profiles match these filters.</div>
    </section>
    <section id="grid" aria-label="Directory" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Executive dossier"></aside>

<script>
/* =====================================================================
   DATASET — one flat array. To extend, append an object.
   ---------------------------------------------------------------------
   PROFILE (required):
     id, name, type ("operator"|"investor"|"historic"|"tech"),
     category ("B2B Operators"|"Capital Allocators"|"Historic Visionaries"|"Tech Compounders"),
     netWorthTier ("$500K-$5M"|"$5M-$100M"|"$100M-$500M"|"$500M-$1B"|"$1B+"),
     humbleBeginnings, breakthrough, shieldingStrategy, industry,
     originBadge, engineBadge, capitalBadge,
     connections: ["other-id", ...]   ← plain ids work
               or [{"id":"other-id","type":"supply","label":"buns since 1955"}, ...]

function normalize(raw){
  const arr = Array.isArray(raw) ? raw : (raw.records || raw.profiles || []);
  const byId = {}, profiles = [], entities = [];
  arr.forEach(r=>{
    if(!r || !r.id){ console.warn('Skipping record without id', r); return; }
    const n = {...r};
    if(n.type === 'entity'){ n._kind='entity'; entities.push(n); }
    else {
      n._kind='profile';
      if(!CATS[n.category]) n.category = TYPE_TO_CAT[n.type] || 'B2B Operators';
      if(!TIERS[n.netWorthTier]) console.warn(`${n.id}: unknown netWorthTier "${n.netWorthTier}"`);
      profiles.push(n);
    }
    byId[n.id]=n;
  });
  const links = [], seen = new Set();
  arr.forEach(r=>(r?.connections||[]).forEach(c=>{
    const o = typeof c==='string' ? {id:c} : c;
    if(!byId[o.id]){ console.warn(`${r.id}: connection to unknown id "${o.id}" skipped`); return; }
    const key=[r.id,o.id].sort().join('|');
    if(seen.has(key)) return; seen.add(key);
    links.push({source:r.id, target:o.id, type:EDGE[o.type]?o.type:'connection', label:o.label||''});
  }));
  const nbNames = id => links.filter(l=>l.source===id||l.target===id).map(l=>byId[l.source===id?l.target:l.source].name);
  profiles.forEach(p=>{ p._hay=[p.name,...(p.aliases||[]),p.category,p.industry,p.netWorthTier,p.originBadge,p.engineBadge,p.capitalBadge,
    p.humbleBeginnings,p.breakthrough,p.shieldingStrategy,p.base,
    ...(p.breakthroughDetail||[]).map(x=>x.t+' '+x.d),...(p.shieldingDetail||[]).map(x=>x.t+' '+x.d),
    ...nbNames(p.id)].join(' ').toLowerCase(); });
  entities.forEach(e=>{ e._hay=[e.name,e.kind,e.description].join(' ').toLowerCase(); });
  return {profiles, entities, links, byId};
}
/* Overlaps: two people overlap when they reach the same entity through real (non-"parallel")
   links, passing only through entities, within OVL_HOPS steps. */
const OVL_HOPS = 3;
function computeOverlaps(D){
  const adj=new Map(), add=(a,b,l)=>{ if(!adj.has(a)) adj.set(a,[]); adj.get(a).push({id:b,l}); };
  D.links.forEach(l=>{ if(l.type==='parallel') return; add(l.source,l.target,l); add(l.target,l.source,l); });
  const hubs=new Map();                                  // entityId -> Map(profileId -> path)
  D.profiles.forEach(p=>{
    const seen=new Set([p.id]), q=[[p.id]];
    while(q.length){
      const path=q.shift(); if(path.length>OVL_HOPS) continue;
      (adj.get(path[path.length-1])||[]).forEach(({id})=>{
        if(seen.has(id)||D.byId[id]._kind!=='entity') return;
        seen.add(id); const np=[...path,id]; q.push(np);
        if(!hubs.has(id)) hubs.set(id,new Map()); hubs.get(id).set(p.id,np);
      });
    }
  });
  const pairs=new Map(), key=(a,b)=>[a,b].sort().join('|');
  const deg=id=>adj.get(id)?.length||0;
  // A pair's hub is the best-connected company on its path; ties between equal-length paths go to the bigger hub.
  const offer=(a,b,path)=>{
    const hub=path.slice(1,-1).reduce((h,id)=>!h||deg(id)>deg(h)?id:h,null), k=key(a,b), cur=pairs.get(k);
    if(!cur||path.length<cur.path.length||(path.length===cur.path.length&&hub&&cur.hub&&deg(hub)>deg(cur.hub))) pairs.set(k,{a,b,path,hub}); };
  D.links.forEach(l=>{ if(l.type!=='parallel' && D.byId[l.source]._kind==='profile' && D.byId[l.target]._kind==='profile') offer(l.source,l.target,[l.source,l.target]); });
  hubs.forEach(m=>{
    const ents=[...m.entries()];
    for(let i=0;i<ents.length;i++) for(let j=i+1;j<ents.length;j++){
      const [a,pa]=ents[i], [b,pb]=ents[j];
      if(pa.some((x,k)=>k>0&&pb.includes(x)&&x!==pa[pa.length-1])) continue;   // a nearer shared node exists
      offer(a,b,[...pa,...pb.slice(0,-1).reverse()]);
    }
  });
  const meet=new Map();                                  // entityId -> Map(profileId -> path), meeting points only
  pairs.forEach(({a,b,path,hub})=>{ if(!hub) return; if(!meet.has(hub)) meet.set(hub,new Map());
    const i=path.indexOf(hub), m=meet.get(hub), set=(p,pp)=>{ if(!m.has(p)||pp.length<m.get(p).length) m.set(p,pp); };
    set(a,path.slice(0,i+1)); set(b,path.slice(i).reverse()); });
  const byProfile=new Map(D.profiles.map(p=>[p.id,[]]));
  pairs.forEach(pr=>{ byProfile.get(pr.a).push({other:pr.b,path:pr.path}); byProfile.get(pr.b).push({other:pr.a,path:[...pr.path].reverse()}); });
  byProfile.forEach(l=>l.sort((x,y)=>x.path.length-y.path.length));
  D.entities.forEach(e=>{ e._shared=meet.get(e.id)?.size||0; });
  return {hubs:meet, pairs, byProfile};
}
/* Map regions: each person joins the largest shared hub (3+ people) they belong to, so every
   industry's hub-and-spoke cluster gets its own region. Entities follow their nearest person. */
function computeCommunities(D){
  const H=D.ovl.hubs, hubs=[...H.entries()].filter(([,m])=>m.size>=3).sort((a,b)=>b[1].size-a[1].size).map(([id])=>id);
  const comm=new Map();
  D.profiles.forEach(p=>{ const h=hubs.find(h=>H.get(h).has(p.id)); if(h) comm.set(p.id,h); });
  // a lone member of a region moves next to a person they are directly tied to
  const members=c=>D.profiles.filter(p=>comm.get(p.id)===c).length;
  D.profiles.forEach(p=>{
    if(comm.has(p.id)&&members(comm.get(p.id))>1) return;
    const tie=(D.ovl.byProfile.get(p.id)||[]).find(o=>o.path.length===2&&comm.has(o.other)&&comm.get(o.other)!==comm.get(p.id));
    if(tie) comm.set(p.id,comm.get(tie.other));
  });
  // every hub sits in the region most of its people chose
  H.forEach((m,h)=>{ const c=new Map(); m.forEach((_,p)=>{ if(comm.has(p)) c.set(comm.get(p),(c.get(comm.get(p))||0)+1); });
    if(c.size) comm.set(h,[...c.entries()].sort((x,y)=>y[1]-x[1])[0][0]); });
  const nb=new Map(), add=(a,b)=>{ if(!nb.has(a)) nb.set(a,[]); nb.get(a).push(b); };
  D.links.forEach(l=>{ if(l.type!=='parallel'){ add(l.source,l.target); add(l.target,l.source); } });
  let frontier=[...comm.keys()];
  while(frontier.length){
    const next=[];
    frontier.forEach(id=>(nb.get(id)||[]).forEach(o=>{ if(!comm.has(o)){ comm.set(o,comm.get(id)); next.push(o); } }));
    frontier=next;
  }
  const regions=[...new Set(D.profiles.map(p=>comm.get(p.id)).filter(Boolean))], idx=new Map(regions.map((c,i)=>[c,i]));
  Object.values(D.byId).forEach(n=>{ n._comm=idx.has(comm.get(n.id))?idx.get(comm.get(n.id)):-1; });
  return regions.length;
}
const commCenter = (i,w,h) => { const n=DATA.nComm||1, a=-Math.PI/2+2*Math.PI*i/n, R=Math.min(w,h)*.36;
  return i<0 ? [w/2,h/2] : [w/2+Math.cos(a)*R*1.25, h/2+Math.sin(a)*R]; };
const linkBetween = (a,b) => DATA.links.find(l=>(l.source===a&&l.target===b)||(l.source===b&&l.target===a));
const viaText = path => path.length<=2 ? 'direct: '+(linkBetween(path[0],path[1])?.label||'linked')
  : 'via '+path.slice(1,-1).map(id=>DATA.byId[id].name).join(' → ');
const catColor = n => CATS[n.category]?.color || '#94A3B8';
const colorOf = n => n._kind==='profile' ? catColor(n) : ENTITY_COLOR;
const passCat = p => state.cat==='all' || p.category===state.cat;
const passTier = p => state.tier==='all' || p.netWorthTier===state.tier;
const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const matchQ = n => { const t=terms(); return !t.length || t.every(w=>n._hay.includes(w)); };
const visibleProfiles = () => DATA.profiles.filter(p=>passCat(p)&&passTier(p)&&matchQ(p));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hl(text){
  const t=terms(); let out=esc(text); if(!t.length) return out;
  t.forEach(w=>{ const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); out=out.replace(re,'<mark>$1</mark>'); });
  return out;
}
function neighbors(id){
  return DATA.links.filter(l=>l.source===id||l.target===id).map(l=>{
    const out=l.source===id; return {link:l, other:DATA.byId[out?l.target:l.source], out};
  });
}
const tierLabel = p => (p.netWorthTier||'—') + (p.tierBasis==='estimated'?' est.':'');

/* Visible subgraph: filtered profiles + entities reachable through entities (≤2 hops) */
function subgraph(){
  const profs = visibleProfiles();
  if(state.overlap){
    const ok=new Set(profs.map(p=>p.id)), vis=new Map(), edges=new Set();
    DATA.ovl.pairs.forEach(({a,b,path})=>{
      if(!ok.has(a)||!ok.has(b)) return;
      const home=DATA.byId[a];
      path.forEach(id=>{ if(!vis.has(id)){ const n=DATA.byId[id]; vis.set(id,n._kind==='profile'?{cat:n.category,tier:n.netWorthTier}:{cat:home.category,tier:home.netWorthTier}); } });
      path.slice(1).forEach((id,i)=>edges.add([path[i],id].sort().join('|')));
    });
    return {vis, links: DATA.links.filter(l=>edges.has([l.source,l.target].sort().join('|')))};
  }
  const vis = new Map(profs.map(p=>[p.id,{cat:p.category,tier:p.netWorthTier}]));
  let frontier = profs.map(p=>p.id);
  for(let hop=0; hop<2; hop++){
    const next=[];
    frontier.forEach(id=>{
      const home=vis.get(id);
      DATA.links.forEach(l=>{
        if(l.type==='parallel') return;
        const other = l.source===id ? l.target : l.target===id ? l.source : null;
        if(!other || vis.has(other) || DATA.byId[other]._kind!=='entity') return;
        vis.set(other,home); next.push(other);
      });
    });
    frontier=next;
  }
  return {vis, links: DATA.links.filter(l=>vis.has(l.source)&&vis.has(l.target))};
}

  const edges = Object.entries(EDGE).filter(([k])=>used.has(k)).map(([k,e])=>`<div class="it"><span class="ln" style="border-color:${e.color};border-top-style:${DASHED.includes(k)?'dashed':DOTTED.includes(k)?'dotted':'solid'}"></span>${e.label}</div>`).join('');
  document.getElementById('legend').innerHTML = `<h4>Archetype</h4>${cats}<div class="it"><span class="sw" style="background:${ENTITY_COLOR}"></span>Company / fund / entity</div><div class="it"><span class="sw" style="background:#111827;box-shadow:inset 0 0 0 2px #E2E8F0"></span>Shared by 2+ people</div>
    <div class="extra"><h4>Net Worth Tier</h4><div class="sizes">${sizes}</div><h4>Connection</h4>${edges}</div>`;
}

function renderMap(){
  const host=document.getElementById('map');
  host.querySelector('svg')?.remove();
  if(G.sim) G.sim.stop();
  const {vis,links}=subgraph();
  document.getElementById('mapEmpty').hidden = vis.size>0;
  const w=host.clientWidth, h=host.clientHeight; G.w=w; G.h=h;

  G.nodes=[...vis.entries()].map(([id,home])=>{
    const src=DATA.byId[id], p=G.pos.get(id);
    const [cx,cy]=commCenter(src._comm,w,h);
    return {...src, home, r:rFor(src), x:p?.x ?? cx+(Math.random()-.5)*120, y:p?.y ?? cy+(Math.random()-.5)*120};
  });
  G.links=links.map(l=>({...l}));

  const svg=d3.select(host).insert('svg',':first-child').attr('viewBox',[0,0,w,h]).attr('role','img').attr('aria-label','Network mind map');
  G.svg=svg;
  const defs=svg.append('defs');
  defs.append('filter').attr('id','glow').attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%')
    .append('feGaussianBlur').attr('stdDeviation',6);
  Object.entries(EDGE).forEach(([k,e])=>{
    defs.append('marker').attr('id','ar-'+k).attr('viewBox','0 -5 10 10').attr('refX',8).attr('refY',0)
      .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
      .append('path').attr('d','M0,-4L9,0L0,4').attr('fill',e.color);
  });

  const root=svg.append('g'); G.root=root;
  G.userZoomed=false;
  G.zoom=d3.zoom().scaleExtent([.15,4]).on('zoom',ev=>{ if(ev.sourceEvent) G.userZoomed=true; root.attr('transform',ev.transform); svg.classed('zoomed',ev.transform.k>1.25); });
  svg.call(G.zoom).on('dblclick.zoom',null);
  svg.on('click',ev=>{ if(ev.target===svg.node()) clearHot(); });

  const link=root.append('g').selectAll('path').data(G.links).join('path')
    .attr('class',d=>`link ${DASHED.includes(d.type)?'dashed':''} ${DOTTED.includes(d.type)?'dotted':''}`)
    .attr('stroke',d=>EDGE[d.type].color)
    .attr('marker-end',d=>d.type==='parallel'?null:`url(#ar-${d.type})`);
  link.append('title').text(d=>`${DATA.byId[d.source].name} → ${DATA.byId[d.target].name}: ${d.label||EDGE[d.type].label}`);
  const elabel=root.append('g').selectAll('text').data(G.links).join('text').attr('class','elabel').attr('text-anchor','middle').text(d=>d.label||'');

  const node=root.append('g').selectAll('g').data(G.nodes,d=>d.id).join('g')
    .attr('class',d=>`node ${d._kind}${isHub(d)?' hub':''}`).attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.name)
    .on('click',(ev,d)=>{ ev.stopPropagation(); openNode(d.id); })
    .on('keydown',(ev,d)=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openNode(d.id);} })
    .on('mouseenter',(ev,d)=>hot(d.id)).on('mouseleave',()=>{ state.openId ? hot(state.openId) : clearHot(); })
    .call(d3.drag()
      .on('start',(ev,d)=>{ if(!ev.active) G.sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on('end',(ev,d)=>{ if(!ev.active) G.sim.alphaTarget(0); d.fx=null; d.fy=null; }));

  const prof=node.filter(d=>d._kind==='profile');
  prof.append('circle').attr('class','halo').attr('r',d=>d.r+8).attr('fill',colorOf).attr('filter','url(#glow)');
  node.append('circle').attr('r',d=>d.r)
    .attr('fill',d=>d._kind==='profile'?colorOf(d):'#111827').attr('fill-opacity',d=>d._kind==='profile'?.16:1)
    .attr('stroke',d=>d._kind==='profile'?colorOf(d):isHub(d)?'#E2E8F0':'#334155').attr('stroke-width',d=>d._kind==='profile'||isHub(d)?2:1.2)
    .attr('stroke-dasharray',d=>d.tierBasis==='estimated'?'4 3':null);
  prof.append('circle').attr('r',d=>Math.max(4,d.r*.28)).attr('fill',colorOf);
  const crowded=G.nodes.length>60;
  node.append('text').attr('text-anchor','middle').attr('dy',d=>d.r+(d._kind==='profile'?16:13))
    .attr('class',d=>crowded&&d._kind==='entity'&&!isHub(d)?'minor':null).text(d=>d.name);
  node.filter(isHub).append('title').text(d=>`${d.name}: shared by ${d._shared} people`);

  G.sim=d3.forceSimulation(G.nodes)
    .force('link',d3.forceLink(G.links).id(d=>d.id)
      .distance(l=>l.type==='parallel'?220:(l.source._kind==='profile'||l.target._kind==='profile')?95:70)
      .strength(l=>l.type==='parallel'?.05:SOFT.includes(l.type)?.25:.7))
    .force('charge',d3.forceManyBody().strength(d=>d._kind==='profile'?-480:isHub(d)?-300:-150))
    .force('collide',d3.forceCollide(d=>d.r+(d._kind==='profile'?26:16)))
    .on('tick',()=>{
      link.attr('d',d=>{
        const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y, L=Math.hypot(dx,dy)||1;
        const tr=d.type==='parallel'?d.target.r:d.target.r+5;
        return `M${d.source.x+dx/L*d.source.r},${d.source.y+dy/L*d.source.r}L${d.target.x-dx/L*tr},${d.target.y-dy/L*tr}`;
      });
      elabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    })
    .on('end',()=>{ G.nodes.forEach(n=>G.pos.set(n.id,{x:n.x,y:n.y})); if(!G.userZoomed) fit(600); });

  applyLayout(false);
  if(state.openId) hot(state.openId);
}

function applyLayout(reheat){
  if(!G.sim) return;
  const {w,h}=G, sim=G.sim;
  const quad={'B2B Operators':[.3,.32],'Capital Allocators':[.7,.32],'Historic Visionaries':[.3,.72],'Tech Compounders':[.7,.72]};
  const tierX={'$500K-$5M':.1,'$5M-$100M':.3,'$100M-$500M':.5,'$500M-$1B':.7,'$1B+':.9};
  sim.force('center', state.layout==='force' ? d3.forceCenter(w/2,h/2) : null);
  if(state.layout==='cluster'){
    sim.force('x',d3.forceX(d=>w*(quad[d.home?.cat]||[.5,.5])[0]).strength(d=>d._kind==='profile'?.18:.08));
    sim.force('y',d3.forceY(d=>h*(quad[d.home?.cat]||[.5,.5])[1]).strength(d=>d._kind==='profile'?.18:.08));
  } else if(state.layout==='tier'){
    sim.force('x',d3.forceX(d=>w*(tierX[d.home?.tier]||.5)).strength(d=>d._kind==='profile'?.3:.1));
    sim.force('y',d3.forceY(h/2).strength(.05));
  } else {
    sim.force('x',d3.forceX(d=>commCenter(d._comm,w,h)[0]).strength(d=>d._comm<0?.02:.06));
    sim.force('y',d3.forceY(d=>commCenter(d._comm,w,h)[1]).strength(d=>d._comm<0?.02:.06));
  }
  sim.alpha(reheat?.9:1).restart();
  clearTimeout(G.fitT); G.fitT=setTimeout(()=>fit(500),900);
}

function fit(dur){
  if(!G.nodes.length||!G.svg) return;
  const pad=70, xs=G.nodes.map(n=>n.x), ys=G.nodes.map(n=>n.y);
  const x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad, y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad+20;
  const L = G.w>760 ? (document.getElementById('legend').offsetWidth+24) : 0;   // keep clear of the legend panel
  const aw=G.w-L, k=Math.max(.15,Math.min(1.6, Math.min(aw/(x1-x0), G.h/(y1-y0))));
  G.svg.transition().duration(dur).call(G.zoom.transform, d3.zoomIdentity.translate(L+aw/2-k*(x0+x1)/2, G.h/2-k*(y0+y1)/2).scale(k));
}
function hot(id){
  if(!G.root) return;
  const nb=new Set([id]); G.links.forEach(l=>{ if(l.source.id===id) nb.add(l.target.id); if(l.target.id===id) nb.add(l.source.id); });
  const on=d=>d.source.id===id||d.target.id===id;
  G.root.selectAll('.node').classed('faded',d=>!nb.has(d.id)).classed('nb',d=>nb.has(d.id)).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',d=>!on(d)).classed('hot',on);
  G.root.selectAll('.elabel').classed('faded',d=>!on(d)).style('opacity',d=>on(d)?.95:null);
}
function clearHot(){
  if(!G.root) return;
  G.root.selectAll('.node').classed('faded',false).classed('nb',false).classed('sel',d=>d.id===state.openId);
  G.root.selectAll('.link').classed('faded',false).classed('hot',false);
  G.root.selectAll('.elabel').classed('faded',false).style('opacity',null);
}

    ${ties.length?`<h3 class="subh">Direct ties between people</h3><div class="ties">${ties.map(l=>`<div class="tie">
      <button data-open="${esc(l.source)}">${hl(DATA.byId[l.source].name)}</button><span class="rel">— ${esc(l.label||EDGE[l.type].label)} (${esc(EDGE[l.type].label.toLowerCase())}) —</span>

function setView(v){
  state.view=v;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  document.getElementById('map').hidden = v!=='map';
  document.getElementById('grid').hidden = v==='map';
  if(v==='map') renderMap(); else if(v==='overlaps') renderOverlaps(); else renderGrid();
}
function route(){
  const [a,b]=location.hash.replace(/^#\/?/,'').split('/');
  const id=b?decodeURIComponent(b):'';
  if(a==='p' && DATA.byId[id]){ showDrawer(id); return; }
  hideDrawer();
  if((a==='grid'||a==='map'||a==='overlaps') && a!==state.view) setView(a);
}

(async function boot(){
  try{
    const r=await fetch('data.json',{cache:'no-store'});
    if(r.ok) DATA=normalize(await r.json());
  }catch(_){/* opened from file:// or no data.json — use embedded copy */}
  if(!DATA) DATA=normalize(EMBEDDED_DATA);
  DATA.ovl=computeOverlaps(DATA);
  DATA.nComm=computeCommunities(DATA);
  renderChips(); renderLegend(); bindUI();
  setView(location.hash.startsWith('#/grid')?'grid':location.hash.startsWith('#/overlaps')?'overlaps':'map');
  route();
})();
</script>
